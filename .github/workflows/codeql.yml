- name: Set CodeQL Languages
  # You may pin to the exact commit or the version.
  # uses: advanced-security/set-codeql-language-matrix@038e12c9474b0c253f122180eb943bee2e10a24a
  uses: advanced-security/set-codeql-language-matrix@v1.6.0
  with:
    # github token
    access-token: 
    # languages API endpoint
    endpoint: 
    # Use a comma separated list here to exclude specific languges from your CodeQL scan.  Example: "python, java"
    exclude: # optional
    # Use a comma separated list here to specify languages that should use manual build mode instead of the default. Example: "java, csharp"
    build-mode-manual-override: # optional
    # Set to "true" to map aliased languages to the standard combined CodeQL language names used by github/codeql-action (e.g. "javascript-typescript" instead of "javascript", "java-kotlin" instead of "java", "c-cpp" instead of "cpp"). This avoids CodeQL treating these languages as separate entries in the code scanning tools page. Defaults to "false" to preserve backward compatibility with existing workflows.
    standard-language-names: # optional, default is false
