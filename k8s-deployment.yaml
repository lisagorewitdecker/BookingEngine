apiVersion: v1
kind: Namespace
metadata:
  name: booking-engine
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-engine-config
  namespace: booking-engine
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  ASPNETCORE_URLS: "http://+:8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: booking-engine-db-secret
  namespace: booking-engine
type: Opaque
stringData:
  connection-string: "Server=postgres-service;Port=5432;Database=booking_engine;User Id=booking_user;Password=booking_password;"
  postgres-password: "booking_password"
  postgres-user: "booking_user"
  postgres-db: "booking_engine"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: booking-engine
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: booking-engine
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: booking-engine-db-secret
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: booking-engine-db-secret
              key: postgres-password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: booking-engine-db-secret
              key: postgres-db
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U booking_user
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: postgres-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: booking-engine-service
  namespace: booking-engine
  labels:
    app: booking-engine
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: booking-engine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-engine
  namespace: booking-engine
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: booking-engine
  template:
    metadata:
      labels:
        app: booking-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: booking-engine
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: booking-engine
        image: booking-engine:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: booking-engine-config
        env:
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: booking-engine-db-secret
              key: connection-string
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: booking-engine
  namespace: booking-engine
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: booking-engine
  namespace: booking-engine
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: booking-engine
  namespace: booking-engine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: booking-engine
subjects:
- kind: ServiceAccount
  name: booking-engine
  namespace: booking-engine
